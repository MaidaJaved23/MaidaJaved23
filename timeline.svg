<svg xmlns="http://www.w3.org/2000/svg" width="900" height="205" viewBox="0 0 900 205" role="img" aria-label="Academic timeline showing completed Associate Degree in Computer Science and completed Bachelor of Science in Computer Science">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient></defs>
  <rect x="1" y="1" width="898" height="203" rx="18" fill="#101827" stroke="#34445e"/>
  <line x1="90" y1="92" x2="810" y2="92" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <!-- Associate Degree Section -->
    <circle cx="245" cy="92" r="13" fill="#14b8a6" stroke="#d1fae5" stroke-width="3"><animate attributeName="r" values="11;14;11" dur="3s" repeatCount="indefinite"/></circle>
    <text x="245" y="48" text-anchor="middle" fill="#f3f6ff" font-size="17" font-weight="700">Associate Degree</text>
    <text x="245" y="132" text-anchor="middle" fill="#b8c5dc" font-size="14">Computer Science</text>
    <text x="245" y="157" text-anchor="middle" fill="#5eead4" font-size="13">Completed · CGPA 3.16 / 4.00</text>
    
    <!-- BS Computer Science Section -->
    <circle cx="655" cy="92" r="13" fill="#8b5cf6" stroke="#ede9fe" stroke-width="3"><animate attributeName="r" values="11;14;11" dur="3s" repeatCount="indefinite"/></circle>
    <text x="655" y="48" text-anchor="middle" fill="#f3f6ff" font-size="17" font-weight="700">BS Computer Science</text>
    <text x="655" y="132" text-anchor="middle" fill="#b8c5dc" font-size="14">Virtual University of Pakistan</text>
    <text x="655" y="157" text-anchor="middle" fill="#c4b5fd" font-size="13">Completed · CGPA 3.01 / 4.00</text>
  </g>
</svg>
